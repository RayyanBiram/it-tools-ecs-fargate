name: automating image push to AWS ECR

on: 
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'Dockerfile'
      - 'nginx.conf'  
  workflow_dispatch:

jobs:
    build-and-push:
      runs-on: ubuntu-latest
      environment:
        name: build-push
        
      permissions:
        id-token: write
        contents: read
        security-events: write
    
      steps:
        - name: checkout code
          uses: actions/checkout@v4

        - name: configure aws credentials
          uses: aws-actions/configure-aws-credentials@v6
          with:
            role-to-assume: ${{ secrets.AWS_BUILD_PUSH_ROLE_ARN }}
            aws-region: ${{ vars.AWS_REGION }}

        - name: verify ecs service is active
          run: |
            STATUS=$(aws ecs describe-services --cluster ${{ vars.ECS_CLUSTER }} --services ${{ vars.ECS_SERVICE }} --query 'services[0].status' --output text)
            if [ "$STATUS" != "ACTIVE" ]; then
              echo "::error::ECS service is not ACTIVE (status: $STATUS). Deploy infra via terraform-deploy first."
              exit 1
            fi

        - name: login to aws ecr
          id: ecr
          uses: aws-actions/amazon-ecr-login@v2

        - name: compute short sha
          id: sha
          run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
        
        - name: setup docker buildx
          uses: docker/setup-buildx-action@v4

        - name: build and push
          id: build-image
          uses: docker/build-push-action@v7
          with:
            context: .
            push: false
            load: true
            tags: ${{ steps.ecr.outputs.registry }}/${{ vars.ECS_REPOSITORY }}:${{ steps.sha.outputs.sha_short }}

        - name: run trivy vulnerability scanner
          uses: aquasecurity/trivy-action@v0.36.0
          with:
            image-ref: ${{ steps.ecr.outputs.registry }}/${{ vars.ECS_REPOSITORY }}:${{ steps.sha.outputs.sha_short }}
            format: sarif
            output: trivy-results.sarif
            severity: 'CRITICAL,HIGH'
            exit-code: 1

        - name: upload trivy results to github security
          if: always()
          uses: github/codeql-action/upload-sarif@v3
          with:
            sarif_file: trivy-results.sarif 

        - name: push image to aws ecr
          run: |
            docker push ${{ steps.ecr.outputs.registry }}/${{ vars.ECS_REPOSITORY }}:${{ steps.sha.outputs.sha_short }}

        - name: download task definition
          run: |
            aws ecs describe-task-definition --task-definition ${{ vars.ECS_TASK_DEFINITION }} --query taskDefinition > task-definition.json

        - name: fill in new image id into ecs task definition
          id: task-def
          uses: aws-actions/amazon-ecs-render-task-definition@v1
          with:
            task-definition: task-definition.json
            container-name: ${{ vars.CONTAINER_NAME }}
            image: ${{ steps.ecr.outputs.registry }}/${{ vars.ECS_REPOSITORY }}:${{ steps.sha.outputs.sha_short }}

        - name: deploy ecs task definition
          uses: aws-actions/amazon-ecs-deploy-task-definition@v2
          with:
            task-definition: ${{ steps.task-def.outputs.task-definition }}
            service: ${{ vars.ECS_SERVICE }}
            cluster: ${{ vars.ECS_CLUSTER }}
            wait-for-service-stability: true

        - name: wait for ecs service stability
          run: |
            aws ecs wait services-stable --cluster ${{ vars.ECS_CLUSTER }} --services ${{ vars.ECS_SERVICE }}

        - name: check https path
          run: |
            curl -f https://tools.biram.uk/health
          